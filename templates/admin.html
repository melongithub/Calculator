<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台账号管理</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 10px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 头部排版：手机端上下排列 */
        .header { display: flex; flex-direction: column; gap: 15px; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 1.5rem; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;}
        
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; text-decoration: none; font-size: 14px; white-space: nowrap; text-align: center; }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        .btn-green { background-color: #28a745; width: 100%; margin-top: 5px; } /* 手机端确认按钮占满全宽 */
        
        .msg { color: #28a745; font-weight: bold; margin-bottom: 15px; background: #e8f5e9; padding: 10px; border-radius: 4px;}
        
        /* 添加账号区域：手机端竖向排列 */
        .add-box { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd; }
        .add-box h3 { margin-top: 0; }
        .add-form { display: flex; flex-direction: column; gap: 10px; }
        .add-form input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* 表格区域：太宽时允许横向手指滑动 */
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; } 
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; font-size: 14px; vertical-align: middle; }
        th { background-color: #f8f9fa; }
        
        /* 修改密码区域 */
        .change-pwd { display: flex; flex-direction: column; gap: 5px; align-items: center; }
        .change-pwd input { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .change-pwd button { width: 100%; }

        /* 电脑端排版微调 (屏幕大于600px时自动变为横向) */
        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
            .add-form { flex-direction: row; align-items: center; }
            .add-form input { flex: 1; }
            .btn-green { width: auto; margin-top: 0; }
            .change-pwd { flex-direction: row; }
            .change-pwd input { width: 100px; }
            .change-pwd button { width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚙️ 账号管理中心</h2>
            <div class="header-actions">
                <span>当前登录: <b style="color: #dc3545;">{{ current_user }}</b></span>
                <a href="/calculator" class="btn btn-blue">返回计算器</a>
                <a href="/logout" class="btn btn-red">退出登录</a>
            </div>
        </div>

        {% if message %}
        <div class="msg">✅ {{ message }}</div>
        {% endif %}

        <div class="add-box">
            <h3>➕ 添加新账号</h3>
            <form method="post" class="add-form">
                <input type="hidden" name="action" value="add">
                <input type="text" name="new_username" placeholder="输入新账号名称" required>
                <input type="password" name="new_password" placeholder="输入初始密码" required>
                <button type="submit" class="btn btn-green">确认添加</button>
            </form>
        </div>

        <h3>👥 当前系统账号列表</h3>
        <div class="table-responsive">
            <table>
                <tr>
                    <th>ID</th>
                    <th>账号名称</th>
                    <th>修改密码</th>
                    <th>操作</th>
                </tr>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td><b>{{ user.username }}</b></td>
                    <td>
                        <form method="post" class="change-pwd">
                            <input type="hidden" name="action" value="change_pwd">
                            <input type="hidden" name="user_id" value="{{ user.id }}">
                            <input type="password" name="new_password" placeholder="新密码" required>
                            <button type="submit" class="btn btn-blue">修改</button>
                        </form>
                    </td>
                    <td>
                        <form method="post" onsubmit="return confirm('警告：确定要彻底删除账号【{{ user.username }}】吗？');">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="user_id" value="{{ user.id }}">
                            <button type="submit" class="btn btn-red">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
